<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>قرآن کریم · نور</title>
<meta name="description" content="قرائت قرآن کریم با ترجمه فارسی فولادوند، حالت پیوسته و مصحف، پخش صوت">
<meta name="theme-color" content="#B08D3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="قرآن کریم">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ═══════════════════════════════════════
   Theme Variables
═══════════════════════════════════════ */
:root, [data-theme="light"] {
  --bg:          #F5EDE0;
  --bg-elevated: #FBF6EC;
  --bg-card:     #FFFEF9;
  --bg-soft:     rgba(198,161,91,0.09);
  --border:      rgba(180,150,90,0.16);
  --border-strong: rgba(160,130,70,0.28);
  --gold:        #B08D3E;
  --gold-light:  #8B6914;
  --gold-dim:    #7A5E20;
  --text:        #2A2115;
  --text-soft:   #5A4828;
  --text-muted:  #8A7A5A;
  --paper:       #FFFEF8;
  --paper-end:   #F8F0DC;
  --ink:         #1A140A;
  --ink-soft:    #4A3C28;
  --maroon:      #7A2A32;
  --accent:      #B08D3E;
  --success:     #4CAF7A;
  --radius:      16px;
  --radius-sm:   14px;
  --shadow:      0 4px 18px rgba(90,70,30,0.07);
  --safe-t:      env(safe-area-inset-top, 0px);
  --safe-b:      env(safe-area-inset-bottom, 0px);
  --arabic-size: 27px;
  --tr-size:     14.5px;
}

[data-theme="dark"] {
  --bg:          #0B1C1A;
  --bg-elevated: #122826;
  --bg-card:     rgba(18, 40, 38, 0.9);
  --bg-soft:     rgba(198,161,91,0.08);
  --border:      rgba(198,161,91,0.18);
  --border-strong: rgba(198,161,91,0.35);
  --gold:        #C6A15B;
  --gold-light:  #EAD08C;
  --gold-dim:    #8E742F;
  --text:        #F5EDE0;
  --text-soft:   #B8A98A;
  --text-muted:  #7A6E55;
  --paper:       #F8F0D8;
  --paper-end:   #F3E8C8;
  --ink:         #1F1609;
  --ink-soft:    #5A4828;
  --maroon:      #8B2E3A;
  --accent:      #C6A15B;
  --shadow:      0 8px 32px rgba(0,0,0,0.35);
}

[data-theme="sepia"] {
  --bg:          #EDE4CF;
  --bg-elevated: #F5ECD8;
  --bg-card:     #FBF6E9;
  --bg-soft:     rgba(120,90,40,0.08);
  --border:      rgba(120,90,40,0.18);
  --border-strong: rgba(120,90,40,0.30);
  --gold:        #8B6914;
  --gold-light:  #6B5210;
  --gold-dim:    #5A4510;
  --text:        #2C2112;
  --text-soft:   #5A4828;
  --text-muted:  #7A6E55;
  --paper:       #FBF6E9;
  --paper-end:   #F5ECD8;
  --ink:         #2C2112;
  --ink-soft:    #5A4828;
  --maroon:      #6B2A30;
  --accent:      #8B6914;
  --shadow:      0 4px 16px rgba(80,60,20,0.08);
}

/* ═══════════════════════════════════════
   Reset & Base
═══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Vazirmatn', system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  background-image:
    radial-gradient(ellipse 110% 50% at 50% -5%, rgba(198,161,91,0.06), transparent 50%);
}

button { font-family: inherit; }

/* ═══════════════════════════════════════
   Views
═══════════════════════════════════════ */
.view {
  display: none;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.view.active { display: flex; }

/* ═══════════════════════════════════════
   Header
═══════════════════════════════════════ */
.header {
  flex: none;
  padding: calc(18px + var(--safe-t)) 20px 16px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-family: 'Amiri Quran', serif;
  font-size: 27px;
  font-weight: 400;
  color: var(--gold-light);
  letter-spacing: 0.03em;
  line-height: 1.2;
}
.header p {
  margin-top: 5px;
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.02em;
}

.header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 16px;
}

.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 9px 13px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-soft);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.chip:active { transform: scale(0.96); }
.chip.spinning { opacity: 0.6; }
.pull-indicator {
  flex: none;
  height: 0;
  opacity: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: height 0.15s ease, opacity 0.15s ease;
}
.pull-indicator.ready { color: var(--gold-light); }
.pull-ico {
  display: inline-block;
  font-size: 20px;
  transition: transform 0.15s ease, color 0.15s ease;
}
.pull-indicator.ready .pull-ico { transform: rotate(180deg); }
.pull-indicator.spinning .pull-ico { animation: chip-spin 0.6s linear infinite; }
@keyframes chip-spin { to { transform: rotate(360deg); } }
.chip.primary {
  background: linear-gradient(135deg, rgba(198,161,91,0.30), rgba(198,161,91,0.14));
  border-color: var(--gold);
  color: var(--gold-light);
  font-weight: 600;
  box-shadow: 0 3px 10px rgba(176,141,62,0.16);
}

/* ═══════════════════════════════════════
   Search
═══════════════════════════════════════ */
.search-wrap {
  flex: none;
  padding: 8px 16px 10px;
}
.search-box {
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 12px 42px 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elevated);
  color: var(--text);
  font: 14.5px 'Vazirmatn', sans-serif;
  outline: none;
  direction: rtl;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--gold); }
.search-box input::placeholder { color: var(--text-muted); }
.search-box .ico {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
  display: flex;
  align-items: center;
}
.search-box .ico svg { width: 18px; height: 18px; }

/* ═══════════════════════════════════════
   List
═══════════════════════════════════════ */
.list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 4px 14px 16px;
  scrollbar-width: none;
}
.list::-webkit-scrollbar { display: none; width: 0; height: 0; }

.item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 14px;
  margin-bottom: 7px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.item:active {
  background: var(--bg-soft);
  border-color: var(--border-strong);
}

.item-num {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--gold), var(--gold-dim));
  color: #fff;
  font-weight: 700;
  font-size: 13.5px;
  display: grid;
  place-items: center;
  box-shadow: 0 2px 8px rgba(176,141,62,0.22);
}
[data-theme="dark"] .item-num { color: #0B1C1A; }

.item-info { flex: 1; min-width: 0; }
.item-info .name {
  font-family: 'Amiri Quran', serif;
  font-size: 17.5px;
  color: var(--gold-light);
  line-height: 1.3;
}
.item-info .meta {
  margin-top: 2px;
  font-size: 12px;
  color: var(--text-muted);
}

.item-arrow {
  color: var(--text-muted);
  font-size: 18px;
  opacity: 0.55;
}

.empty {
  padding: 56px 24px;
  text-align: center;
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-muted);
}

/* ═══════════════════════════════════════
   Bottom Nav
═══════════════════════════════════════ */
.nav {
  flex: none;
  display: flex;
  background: var(--bg-elevated);
  border-top: 1px solid var(--border);
  padding: 6px 0 calc(6px + var(--safe-b));
  box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
}
.nav button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 4px;
  border: none;
  background: none;
  color: var(--text-muted);
  font-size: 11.5px;
  cursor: pointer;
  transition: color 0.15s;
}
.nav button.active { color: var(--gold-light); }
.nav .ico { font-size: 20px; line-height: 1; }

/* ═══════════════════════════════════════
   Reader – Scroll Mode (paper / continuous)
═══════════════════════════════════════ */
.reader-top {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(10px + var(--safe-t)) 14px 10px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  z-index: 20;
}
.reader-top .title-block {
  flex: 1;
  min-width: 0;
  text-align: center;
}
.reader-top .surah-name {
  font-family: 'Amiri Quran', serif;
  font-size: 20px;
  color: var(--gold-light);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.reader-top .progress {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--gold-light);
  font-size: 17px;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex-shrink: 0;
  box-shadow: var(--shadow);
  transition: background 0.15s, transform 0.1s;
}
.icon-btn:active { transform: scale(0.95); }
.icon-btn.active { color: #C9A227; border-color: var(--gold); }

.scroll-reader {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 0;
  background: var(--bg);
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

/* ── Continuous paper page – text written on background ── */
.paper-page {
  min-height: 100%;
  margin: 0 auto;
  max-width: 560px;
  padding: 22px 20px 120px;
  background: linear-gradient(180deg, var(--paper) 0%, var(--paper-end) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(142,116,47,0.12),
    0 0 40px rgba(0,0,0,0.04);
  position: relative;
}

.paper-page::before {
  content: '';
  position: absolute;
  inset: 10px;
  border: 1.5px solid rgba(142,116,47,0.22);
  border-radius: 2px;
  pointer-events: none;
  z-index: 1;
}
.paper-page::after {
  content: '';
  position: absolute;
  inset: 14px;
  border: 1px solid rgba(142,116,47,0.10);
  border-radius: 1px;
  pointer-events: none;
  z-index: 1;
}

.surah-play-row {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: center;
  padding: 4px 0 14px;
}

.btn-play-surah {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 10px 20px;
  border-radius: 999px;
  border: 1px solid rgba(142,116,47,0.35);
  background: linear-gradient(135deg, rgba(198,161,91,0.22), rgba(198,161,91,0.09));
  color: var(--maroon);
  font: 600 13px 'Vazirmatn', sans-serif;
  letter-spacing: 0.01em;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(142,116,47,0.12);
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.btn-play-surah:active { transform: scale(0.97); background: rgba(198,161,91,0.28); }
.btn-play-surah .ico {
  display: inline-flex;
  align-items: center;
  font-size: 12px;
}

.basmala-block {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 12px 12px 16px;
  font-family: 'Amiri Quran', serif;
  font-size: 22px;
  color: var(--maroon);
  line-height: 1.7;
}

.continuous-text {
  position: relative;
  z-index: 2;
  font-family: 'Amiri Quran', serif;
  font-size: var(--arabic-size);
  line-height: 2.4;
  color: var(--ink);
  text-align: justify;
  text-align-last: center;
  direction: rtl;
  padding: 2px 4px 8px;
}

.ayah-num-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.55em;
  height: 1.55em;
  margin: 0 4px;
  position: relative;
  top: -2px;
  vertical-align: middle;
  border: 1.3px solid var(--gold-dim);
  border-radius: 50%;
  background: rgba(198,161,91,0.12);
  font: 700 0.32em 'Vazirmatn', sans-serif;
  color: var(--maroon);
  cursor: pointer;
}

.ayah-tr-inline {
  display: block;
  margin: 4px 0 16px;
  padding: 4px 8px 2px 2px;
  border-right: 2.5px solid rgba(142,116,47,0.25);
  font-family: 'Vazirmatn', sans-serif;
  font-size: var(--tr-size);
  line-height: 1.9;
  color: var(--ink-soft);
  text-align: justify;
  text-align-last: right;
}

.ayah-wrap.playing .ayah-num-badge {
  background: rgba(198,161,91,0.30);
  border-color: var(--gold);
}

.q-word {
  border-radius: 5px;
  padding: 0 2px;
  transition: color 0.15s ease, background-color 0.15s ease;
}
.q-word.q-word-active {
  color: var(--maroon);
  background: rgba(198,161,91,0.35);
}

/* ═══════════════════════════════════════
   Reader – Book / Mushaf Mode
═══════════════════════════════════════ */
.stage {
  flex: 1;
  position: relative;
  display: flex;
  align-items: stretch;
  justify-content: center;
  min-height: 0;
  padding: 6px 6px 0;
  perspective: 2000px;
}

.book {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100%;
  transform-style: preserve-3d;
}

.page {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, var(--paper), var(--paper-end));
  border-radius: 3px 8px 8px 3px;
  box-shadow:
    inset 3px 0 10px -3px rgba(0,0,0,0.06),
    0 0 0 1px rgba(142,116,47,0.22),
    0 6px 28px rgba(0,0,0,0.22);
  overflow: hidden;
  backface-visibility: hidden;
  transform-origin: right center;
}
.page.back  { z-index: 1; }
.page.front { z-index: 2; transform: rotateY(0deg); }
.page.front.anim {
  transition: transform 0.48s cubic-bezier(0.22, 0.61, 0.36, 1);
}

.frame {
  position: absolute;
  inset: 6px;
  border: 1.5px solid rgba(142,116,47,0.38);
  border-radius: 2px 5px 5px 2px;
  pointer-events: none;
  z-index: 4;
}
.frame::after {
  content: '';
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(142,116,47,0.16);
  border-radius: 1px 3px 3px 1px;
}

.inner {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  padding: 48px 14px 12px;
  overflow: hidden;
}

.surah-title {
  flex: none;
  position: relative;
  padding-bottom: 8px;
  font-family: 'Amiri Quran', serif;
  font-size: 21px;
  color: var(--maroon);
  text-align: center;
}
.surah-title::before {
  content: '۞';
  display: block;
  margin-bottom: 2px;
  font-size: 13px;
  color: var(--gold-dim);
}
.surah-title::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 18%;
  right: 18%;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--gold-dim) 20%, var(--gold) 50%, var(--gold-dim) 80%, transparent);
}

.basmala {
  flex: none;
  padding: 6px 0 10px;
  font-family: 'Amiri Quran', serif;
  font-size: 19px;
  color: var(--maroon);
  text-align: center;
}

.ayat {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 2px 2px 8px;
  font-family: 'Amiri Quran', serif;
  font-size: var(--arabic-size);
  line-height: 2.2;
  color: var(--ink);
  text-align: justify;
  text-align-last: center;
  direction: rtl;
  scrollbar-width: thin;
  scrollbar-color: rgba(142,116,47,0.3) transparent;
}
.ayat::-webkit-scrollbar { width: 2px; }
.ayat::-webkit-scrollbar-thumb {
  background: rgba(142,116,47,0.35);
  border-radius: 2px;
}

.translation {
  display: block;
  margin: 5px 0 14px;
  padding: 3px 10px 3px 2px;
  border-right: 2.5px solid rgba(142,116,47,0.30);
  border-radius: 0 3px 3px 0;
  background: linear-gradient(270deg, rgba(198,161,91,0.05), transparent);
  font: var(--tr-size)/1.85 'Vazirmatn', sans-serif;
  color: var(--ink-soft);
  text-align: justify;
  text-align-last: right;
}

.pill {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 20;
  padding: 4px 11px;
  border-radius: 999px;
  background: rgba(11,28,26,0.72);
  border: 1px solid rgba(234,208,140,0.28);
  backdrop-filter: blur(8px);
  font: 11.5px 'Vazirmatn', sans-serif;
  color: var(--gold-light);
  pointer-events: none;
  opacity: 0.94;
}
[data-theme="light"] .pill,
[data-theme="sepia"] .pill {
  background: rgba(255,255,255,0.85);
  color: var(--gold-light);
  border-color: var(--border);
}

/* ═══════════════════════════════════════
   Floating controls & Audio bar
═══════════════════════════════════════ */
.font-controls {
  position: absolute;
  bottom: calc(70px + var(--safe-b));
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  gap: 8px;
}
.font-controls button {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--gold-light);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  box-shadow: var(--shadow);
}

.audio-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 14px calc(10px + var(--safe-b));
  background: var(--bg-elevated);
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
}
.audio-bar.show { display: flex; }

.audio-bar .play-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(145deg, var(--gold), var(--gold-dim));
  color: #fff;
  font-size: 18px;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex-shrink: 0;
}
[data-theme="dark"] .audio-bar .play-btn { color: #0B1C1A; }

.audio-info {
  flex: 1;
  min-width: 0;
}
.audio-info .label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.audio-info .sub {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-top: 1px;
}

  height: 26px;
  border-radius: 13px;
  background: var(--border);

  cursor: pointer;
  transition: background 0.2s;

.toggle.on { background: var(--gold); }

  content: '';
  position: absolute;
  top: 3px;
  right: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);

═══════════════════════════════════════ */

  /* ── Offline IndexedDB ── */
  const DB_NAME = 'quran_db_v2';
  const DB_STORE = 'surahs';
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(DB_STORE)) {
          db.createObjectStore(DB_STORE, { keyPath: 'number' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  async function idbGet(n) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const req = tx.objectStore(DB_STORE).get(n);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    } catch { return null; }
  }
  async function idbSet(data) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(data);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    } catch {}
  }
  async function idbCount() {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const req = tx.objectStore(DB_STORE).count();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    } catch { return 0; }
  }

  /* ── Data ── */
  async function fetchSurah(n) {
    if (cache[n]) return cache[n];
    const stored = await idbGet(n);
    if (stored) { cache[n] = stored; return stored; }

    const res = await fetch(
      `https://api.alquran.cloud/v1/surah/${n}/editions/quran-uthmani,fa.fooladvand`
    );
    if (!res.ok) throw new Error('network');
    const json = await res.json();
    if (json.code !== 200) throw new Error('api');

    const ar = json.data[0];
    const fa = json.data[1];
    const ayahs = ar.ayahs.map((a, i) => ({
      n: a.numberInSurah,
      global: a.number,
      text: a.text.replace(/^\uFEFF/, '').trim(),
      tr: (fa.ayahs[i] && fa.ayahs[i].text) || ''
    }));

    const meta = META.find(s => s.n === n);
    const data = {
      number: n,
      name: 'سورة ' + (meta ? meta.ar : ''),
      ayahs
    };
    cache[n] = data;
    idbSet(data);
    return data;
  }

  let downloading = false;
  async function downloadAllOffline(statusEl) {
    if (downloading) return;
    downloading = true;
    let done = 0;
    for (let n = 1; n <= 114; n++) {
      try {
        if (!cache[n] && !(await idbGet(n))) await fetchSurah(n);
        done++;
        if (statusEl) statusEl.textContent = `آفلاین: ${toEastern(done)} / ۱۱۴`;
      } catch {
        if (statusEl) statusEl.textContent = `خطا در سوره ${toEastern(n)} — ادامه...`;
      }
    }
    downloading = false;
    if (statusEl) statusEl.textContent = 'همه سوره‌ها برای آفلاین آماده‌اند ✓';
  }

  /* ── Pagination (book mode) ── */
  function isArabicDiacritic(ch) {
    const c = ch.codePointAt(0);
    return (c >= 0x064B && c <= 0x065F) || c === 0x0670 || (c >= 0x06D6 && c <= 0x06ED) || c === 0x0640;
  }
  function normalizeArabicChar(ch) {
    if (isArabicDiacritic(ch)) return '';
    const map = { 'أ': 'ا', 'إ': 'ا', 'آ': 'ا', 'ٱ': 'ا', 'ى': 'ي', 'ة': 'ه' };
    return map[ch] || ch;
  }
  function normalizeArabicStr(str) {
    return Array.from(str).map(normalizeArabicChar).join('').replace(/\s+/g, '');
  }
  const BASMALA_NORM = normalizeArabicStr(BASMALA);

  function stripLeadingBasmala(text) {
    const chars = Array.from(text);
    let acc = '', i = 0;
    while (i < chars.length && acc.length < BASMALA_NORM.length) {
      const n = normalizeArabicChar(chars[i]);
      if (n) acc += n;
      i++;
    }
    if (acc !== BASMALA_NORM) return text;
    while (i < chars.length && /\s/.test(chars[i])) i++;
    return chars.slice(i).join('');
  }

  function prepareAyahs(data) {
    let list = data.ayahs.slice();
    if (data.number === 1 && list[0] && /بِسْمِ|بسم/.test(list[0].text) && list[0].text.length < 60) {
      list = list.slice(1);
    }
    return list.map(a => {
      let text = a.text;
      if (data.number !== 1 && data.number !== 9) {
        text = stripLeadingBasmala(text);
      }
      return { n: a.n, global: a.global, text, tr: a.tr };
    });
  }

  function getAvailableHeight(isFirstPage, hasBasmala) {
    const pageEl = pageFront;
    const pageH = pageEl.clientHeight || window.innerHeight * 0.85;
    const topPad = 50, bottomPad = 12, margin = 8;
    let headerH = 0;
    if (isFirstPage) {
      headerH = 48;
      if (hasBasmala) headerH += 42;
    }
    return Math.max(120, pageH - topPad - bottomPad - headerH - margin);
  }

  function wordSpans(text) {
    return text.split(' ').filter(Boolean)
      .map((w, i) => `<span class="q-word" data-wi="${i}">${escapeHtml(w)}</span>`)
      .join(' ');
  }

  function measureAyahHeight(ayah, measureEl) {
    measureEl.innerHTML = '';
    const span = document.createElement('span');
    span.innerHTML = `${escapeHtml(ayah.text)}<span class="ayah-num-badge">${toEastern(ayah.n)}</span> `;
    measureEl.appendChild(span);
    if (showTranslation && ayah.tr) {
      const tr = document.createElement('div');
      tr.className = 'translation';
      tr.textContent = ayah.tr;
      measureEl.appendChild(tr);
    }
    return measureEl.scrollHeight;
  }

  function paginate(data) {
    const list = prepareAyahs(data);
    if (!list.length) return [[]];
    const measure = document.createElement('div');
    measure.className = 'ayat';
    measure.style.cssText = `
      position:absolute;visibility:hidden;left:-9999px;top:0;
      width:${Math.min(480, window.innerWidth) - 40}px;
      font-family:'Amiri Quran',serif;font-size:var(--arabic-size);
      line-height:2.2;direction:rtl;text-align:justify;`;
    document.body.appendChild(measure);

    const hasBasmala = data.number !== 9;
    const result = [];
    let chunk = [], used = 0, isFirst = true;

    list.forEach(ayah => {
      const h = measureAyahHeight(ayah, measure);
      const available = getAvailableHeight(isFirst && chunk.length === 0, hasBasmala);
      if (chunk.length && used + h > available) {
        result.push(chunk);
        chunk = [];
        used = 0;
        isFirst = false;
      }
      chunk.push(ayah);
      used += h;
    });
    if (chunk.length) result.push(chunk);
    document.body.removeChild(measure);
    return result.length ? result : [[]];
  }

  /* ── Render Book page ── */
  function buildPage(data, ayahs, container, isFirstPage) {
    container.innerHTML = '';
    if (!data) return;
    if (isFirstPage) {
      const title = document.createElement('div');
      title.className = 'surah-title';
      title.textContent = data.name;
      container.appendChild(title);
      if (data.number !== 9) {
        const basmala = document.createElement('div');
        basmala.className = 'basmala';
        basmala.textContent = BASMALA;
        container.appendChild(basmala);
      }
    }
    const ayatBox = document.createElement('div');
    ayatBox.className = 'ayat';
    ayahs.forEach(a => {
      const span = document.createElement('span');
      span.className = 'ayah-wrap';
      span.dataset.ayah = a.n;
      span.innerHTML = `${wordSpans(a.text)}<span class="ayah-num-badge">${toEastern(a.n)}</span> `;
      ayatBox.appendChild(span);
      if (showTranslation && a.tr) {
        const tr = document.createElement('div');
        tr.className = 'translation';
        tr.textContent = a.tr;
        ayatBox.appendChild(tr);
      }
    });
    container.appendChild(ayatBox);
  }

  function renderCurrent(container) {
    if (!currentSurah || !pages.length) return;
    buildPage(currentSurah, pages[pageIndex] || [], container, pageIndex === 0);
  }

  function updatePill() {
    const s = META.find(x => x.n === currentNum);
    if (!s) { pill.textContent = ''; return; }
    const total = pages.length || 1;
    pill.textContent = total > 1
      ? `${toEastern(s.n)}. ${s.ar} · ${toEastern(pageIndex + 1)}/${toEastern(total)}`
      : `${toEastern(s.n)}. ${s.ar}`;
  }

  /* ── Scroll mode render (quran.com-like) ── */
  function renderScrollMode(highlightAyah) {
    if (!currentSurah) return;
    const data = currentSurah;
    const list = prepareAyahs(data);
    scrollReader.innerHTML = '';

    // One continuous paper page – all text written on the background
    const paper = document.createElement('div');
    paper.className = 'paper-page';

    // Play full surah button at the start
    const playRow = document.createElement('div');
    playRow.className = 'surah-play-row';
    playRow.innerHTML = `<button class="btn-play-surah" id="btn-play-surah"><span class="ico">▶</span><span>پخش سوره</span><span style="opacity:.55">·</span><span>مشاری العفاسی</span></button>`;
    paper.appendChild(playRow);

    if (data.number !== 9) {
      const bas = document.createElement('div');
      bas.className = 'basmala-block';
      bas.textContent = BASMALA;
      paper.appendChild(bas);
    }

    const textBlock = document.createElement('div');
    textBlock.className = 'continuous-text';

    list.forEach(a => {
      const wrap = document.createElement('span');
      wrap.className = 'ayah-wrap';
      wrap.dataset.ayah = a.n;
      if (highlightAyah && a.n === highlightAyah) wrap.classList.add('playing');

      const numBadge = `<span class="ayah-num-badge" data-g="${a.global}" data-n="${a.n}" title="پخش آیه">${toEastern(a.n)}</span>`;
      wrap.innerHTML = `${wordSpans(a.text)}${numBadge} `;

      textBlock.appendChild(wrap);

      if (showTranslation && a.tr) {
        const tr = document.createElement('div');
        tr.className = 'ayah-tr-inline';
        tr.textContent = a.tr;
        textBlock.appendChild(tr);
      }
    });

    paper.appendChild(textBlock);
    scrollReader.appendChild(paper);

    // Play full surah
    const btnPlaySurah = paper.querySelector('#btn-play-surah');
    if (btnPlaySurah) {
      btnPlaySurah.addEventListener('click', () => playSurah(data.number));
    }

    // Tap on ayah number → play audio
    textBlock.querySelectorAll('.ayah-num-badge').forEach(badge => {
      badge.addEventListener('click', e => {
        e.stopPropagation();
        playAyah(+badge.dataset.g, +badge.dataset.n);
      });
    });

    if (highlightAyah) {
      const el = textBlock.querySelector(`[data-ayah="${highlightAyah}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function updateReaderHeader() {
    const s = META.find(x => x.n === currentNum);
    if (!s) return;
    $('reader-surah-name').textContent = s.ar;
    if (readMode === 'book') {
      const total = pages.length || 1;
      $('reader-progress').textContent = total > 1
        ? `صفحه ${toEastern(pageIndex + 1)} از ${toEastern(total)}`
        : `${toEastern(s.a)} آیه`;
    } else {
      $('reader-progress').textContent = `${toEastern(s.a)} آیه · ${s.t === 'M' ? 'مکی' : 'مدنی'}`;
    }
  }

  /* ── Open Surah ── */
  async function openSurah(n, resumePage, focusAyah) {
    n = Math.max(1, Math.min(114, n));
    showView('view-reader');
    loader.classList.add('show');

    try {
      currentSurah = await fetchSurah(n);
      currentNum = n;
      pages = paginate(currentSurah);
      pageIndex = 0;
      if (typeof resumePage === 'number' && resumePage >= 0 && resumePage < pages.length) {
        pageIndex = resumePage;
      }

      if (readMode === 'scroll') {
        renderScrollMode(focusAyah || null);
      } else {
        renderCurrent(innerFront);
        updatePill();
      }
      updateReaderHeader();
      updateMarkButton();
      saveLastRead();
    } catch {
      showToast('بارگذاری ممکن نشد. اتصال اینترنت را بررسی کنید.');
      showView('view-list');
    } finally {
      loader.classList.remove('show');
    }
  }

  $('btn-back').addEventListener('click', () => {
    saveLastRead();
    showView('view-list');
    document.querySelectorAll('.nav button').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === 'list');
    });
    updateContinueButton();
  });
  $('btn-mark').addEventListener('click', toggleBookmark);

  /* ── Page Flip (book mode) ── */
  function finishFlip() {
    if (flipTimer) { clearTimeout(flipTimer); flipTimer = null; }
    pageFront.classList.remove('anim');
    pageFront.style.transform = 'rotateY(0deg)';
    isFlipping = false;
  }

  async function goPage(direction) {
    if (isFlipping || readMode !== 'book') return;
    let targetNum = currentNum, targetPage = pageIndex;

    if (direction === 'next') {
      if (pageIndex + 1 < pages.length) targetPage = pageIndex + 1;
      else if (currentNum < 114) { targetNum = currentNum + 1; targetPage = 0; }
      else return;
    } else {
      if (pageIndex > 0) targetPage = pageIndex - 1;
      else if (currentNum > 1) { targetNum = currentNum - 1; targetPage = -1; }
      else return;
    }

    isFlipping = true;

    if (targetNum === currentNum) {
      buildPage(currentSurah, pages[targetPage], innerBack, targetPage === 0);
      pageFront.classList.remove('anim');
      pageFront.style.transform = 'rotateY(0deg)';
      void pageFront.offsetWidth;
      pageFront.classList.add('anim');
      requestAnimationFrame(() => { pageFront.style.transform = 'rotateY(179.9deg)'; });

      const onEnd = (e) => {
        if (e.propertyName !== 'transform') return;
        pageFront.removeEventListener('transitionend', onEnd);
        pageIndex = targetPage;
        renderCurrent(innerFront);
        updatePill();
        updateReaderHeader();
        saveLastRead();
        pageFront.classList.remove('anim');
        pageFront.style.transform = 'rotateY(0deg)';
        isFlipping = false;
      };
      pageFront.addEventListener('transitionend', onEnd);
      if (flipTimer) clearTimeout(flipTimer);
      flipTimer = setTimeout(() => {
        pageIndex = targetPage;
        renderCurrent(innerFront);
        updatePill();
        updateReaderHeader();
        saveLastRead();
        finishFlip();
      }, 600);
      return;
    }

    const needsFetch = !cache[targetNum];
    if (needsFetch) loader.classList.add('show');
    try {
      const data = await fetchSurah(targetNum);
      const newPages = paginate(data);
      if (targetPage < 0) targetPage = Math.max(0, newPages.length - 1);
      buildPage(data, newPages[targetPage], innerBack, targetPage === 0);

      pageFront.classList.remove('anim');
      pageFront.style.transform = 'rotateY(0deg)';
      void pageFront.offsetWidth;
      pageFront.classList.add('anim');
      requestAnimationFrame(() => { pageFront.style.transform = 'rotateY(179.9deg)'; });

      const onEnd = (e) => {
        if (e.propertyName !== 'transform') return;
        pageFront.removeEventListener('transitionend', onEnd);
        currentSurah = data; currentNum = targetNum; pages = newPages; pageIndex = targetPage;
        renderCurrent(innerFront);
        updatePill(); updateReaderHeader(); updateMarkButton(); saveLastRead();
        pageFront.classList.remove('anim');
        pageFront.style.transform = 'rotateY(0deg)';
        isFlipping = false;
        loader.classList.remove('show');
      };
      pageFront.addEventListener('transitionend', onEnd);
      if (flipTimer) clearTimeout(flipTimer);
      flipTimer = setTimeout(() => {
        currentSurah = data; currentNum = targetNum; pages = newPages; pageIndex = targetPage;
        renderCurrent(innerFront);
        updatePill(); updateReaderHeader(); updateMarkButton(); saveLastRead();
        finishFlip();
        loader.classList.remove('show');
      }, 600);
    } catch {
      isFlipping = false;
      loader.classList.remove('show');
      showToast('بارگذاری ممکن نشد.');
    }
  }

  /* Keyboard */
  document.addEventListener('keydown', e => {
    if (!$('view-reader').classList.contains('active') || readMode !== 'book') return;
    if (e.key === 'ArrowRight') goPage('next');
    if (e.key === 'ArrowLeft')  goPage('prev');
  });

  /* Touch for book */
  const book = $('book');
  let startX = null, startY = null, startTime = 0;
  let isPinching = false, pinchDist = 0, pinchSize = 0, lastTap = 0;

  book.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      isPinching = true; startX = null;
      const [a, b] = e.touches;
      pinchDist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
      pinchSize = fontSize;
      return;
    }
    isPinching = false;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTime = Date.now();
  }, { passive: true });

  book.addEventListener('touchmove', e => {
    if (!isPinching || e.touches.length !== 2 || !pinchDist) return;
    const [a, b] = e.touches;
    const dist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
    fontSize = Math.max(18, Math.min(40, Math.round(pinchSize + (dist - pinchDist) / 8)));
    applyFont();
    savePrefs();
  }, { passive: true });

  book.addEventListener('touchend', e => {
    if (isPinching) { isPinching = false; pinchDist = 0; return; }
    if (startX === null) return;
    const elapsed = Date.now() - startTime;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startX = null;

    if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && elapsed < 250) {
      const now = Date.now();
      if (now - lastTap < 300 && !isFlipping && currentSurah) {
        showTranslation = !showTranslation;
        savePrefs();
        const oldAyah = (pages[pageIndex] && pages[pageIndex][0]) ? pages[pageIndex][0].n : 1;
        pages = paginate(currentSurah);
        pageIndex = Math.max(0, pages.findIndex(p => p.some(a => a.n === oldAyah)));
        renderCurrent(innerFront);
        updatePill();
        lastTap = 0;
      } else lastTap = now;
      return;
    }
    if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy) * 1.1) {
      goPage(dx > 0 ? 'next' : 'prev');
    }
  }, { passive: true });

  /* ── Audio ── */
  function pad3(n) {
    return String(n).padStart(3, '0');
  }

  /* ── Word-by-word highlight (approximate, weighted by letter count) ── */
  let currentWordEls = [];
  let currentWordBoundaries = [];
  let activeWordIndex = -1;

  function getWordEls(localNum) {
    const containers = readMode === 'scroll'
      ? [scrollReader]
      : [innerFront, pageFront].filter(Boolean);
    for (const c of containers) {
      if (!c) continue;
      const wrap = c.querySelector(`.ayah-wrap[data-ayah="${localNum}"]`);
      if (wrap) return Array.from(wrap.querySelectorAll('.q-word'));
    }
    return [];
  }

  function clearWordHighlight() {
    currentWordEls.forEach(el => el.classList.remove('q-word-active'));
    currentWordEls = [];
    currentWordBoundaries = [];
    activeWordIndex = -1;
  }

  function setupWordTimings(localNum, durationMs) {
    clearWordHighlight();
    if (!durationMs || !isFinite(durationMs) || durationMs <= 0) return;
    const els = getWordEls(localNum);
    if (!els.length) return;
    const weights = els.map(el => Math.max(1, el.textContent.trim().length));
    const total = weights.reduce((a, b) => a + b, 0);
    let acc = 0;
    currentWordBoundaries = weights.map(w => {
      acc += w;
      return { end: (acc / total) * durationMs };
    });
    currentWordEls = els;
    activeWordIndex = -1;
  }

  audioEl.addEventListener('timeupdate', () => {
    if (!currentWordBoundaries.length) return;
    const t = audioEl.currentTime * 1000;
    let idx = currentWordBoundaries.findIndex(b => t < b.end);
    if (idx === -1) idx = currentWordBoundaries.length - 1;
    if (idx !== activeWordIndex) {
      if (activeWordIndex >= 0 && currentWordEls[activeWordIndex]) {
        currentWordEls[activeWordIndex].classList.remove('q-word-active');
      }
      activeWordIndex = idx;
      if (currentWordEls[activeWordIndex]) {
        currentWordEls[activeWordIndex].classList.add('q-word-active');
      }
    }
  });

  function startPlayback(url, label, sub, ayahLocal) {
    try {
      audioEl.pause();
      audioEl.removeAttribute('src');
      audioEl.load();
    } catch {}

    currentAudioAyah = ayahLocal || null;
    audioPlaying = true;
    $('audio-play').textContent = '❚❚';
    $('audio-label').textContent = label;
    $('audio-sub').textContent = sub || 'مشاری راشد العفاسی';
    audioBar.classList.add('show');

    audioEl.src = url;
    audioEl.load();

    const tryPlay = () => {
      const p = audioEl.play();
      if (p && typeof p.then === 'function') {
        p.catch(err => {
          console.warn('audio play error', err);
          // fallback: everyayah / mp3quran style
          if (url.includes('cdn.islamic.network') && ayahLocal && currentNum) {
            const alt = `https://everyayah.com/data/Alafasy_128kbps/${pad3(currentNum)}${pad3(ayahLocal)}.mp3`;
            audioEl.src = alt;
            audioEl.load();
            audioEl.play().catch(() => showToast('پخش صدا ممکن نشد. اینترنت را بررسی کنید.'));
          } else if (url.includes('audio-surah') && currentNum) {
            const alt = `https://server8.mp3quran.net/afs/${pad3(currentNum)}.mp3`;
            audioEl.src = alt;
            audioEl.load();
            audioEl.play().catch(() => showToast('پخش صدا ممکن نشد. اینترنت را بررسی کنید.'));
          } else {
            showToast('پخش صدا ممکن نشد. اینترنت را بررسی کنید.');
          }
        });
      }
    };

    if (audioEl.readyState >= 2) tryPlay();
    else {
      audioEl.oncanplay = () => {
        audioEl.oncanplay = null;
        tryPlay();
      };
      // safety timeout
      setTimeout(tryPlay, 800);
    }
  }

  function playSurah(surahNum) {
    if (!surahNum) return;
    const url = `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${surahNum}.mp3`;
    const s = META.find(x => x.n === surahNum);
    startPlayback(
      url,
      s ? `سوره ${s.ar}` : `سوره ${toEastern(surahNum)}`,
      'مشاری راشد العفاسی · کل سوره',
      null
    );
    scrollReader.querySelectorAll('.ayah-wrap.playing').forEach(c => c.classList.remove('playing'));
    clearWordHighlight();
  }

  function playAyah(globalNum, localNum) {
    if (!globalNum) return;
    const url = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${globalNum}.mp3`;
    startPlayback(
      url,
      `آیه ${toEastern(localNum)} · ${META.find(x => x.n === currentNum)?.ar || ''}`,
      'مشاری راشد العفاسی',
      localNum
    );
    scrollReader.querySelectorAll('.ayah-wrap').forEach(c => {
      c.classList.toggle('playing', +c.dataset.ayah === localNum);
    });
    clearWordHighlight();
    const onMeta = () => {
      audioEl.removeEventListener('loadedmetadata', onMeta);
      setupWordTimings(localNum, audioEl.duration * 1000);
    };
    audioEl.addEventListener('loadedmetadata', onMeta);
  }

  function stopAudio() {
    try {
      audioEl.pause();
      audioEl.removeAttribute('src');
      audioEl.load();
    } catch {}
    audioPlaying = false;
    currentAudioAyah = null;
    $('audio-play').textContent = '▶';
    audioBar.classList.remove('show');
    scrollReader.querySelectorAll('.ayah-wrap.playing').forEach(c => c.classList.remove('playing'));
    clearWordHighlight();
  }

  $('audio-play').addEventListener('click', () => {
    if (audioPlaying) {
      if (audioEl.paused) { audioEl.play(); $('audio-play').textContent = '❚❚'; }
      else { audioEl.pause(); $('audio-play').textContent = '▶'; }
    }
  });
  $('audio-close').addEventListener('click', stopAudio);
  audioEl.addEventListener('ended', () => {
    // auto next ayah in scroll mode
    if (readMode === 'scroll' && currentSurah && currentAudioAyah) {
      const next = currentSurah.ayahs.find(a => a.n === currentAudioAyah + 1);
      if (next) playAyah(next.global, next.n);
      else stopAudio();
    } else stopAudio();
  });

  /* ── Settings ── */
  function openSettings() {
    $('overlay').classList.add('show');
    $('settings-panel').classList.add('show');
    applyTheme();
    applyMode();
    applyFont();
    $('toggle-tr').classList.toggle('on', showTranslation);
  }
  function closeSettings() {
    $('overlay').classList.remove('show');
    $('settings-panel').classList.remove('show');
  }

  $('btn-settings').addEventListener('click', openSettings);
  $('btn-settings-home').addEventListener('click', openSettings);
  $('overlay').addEventListener('click', closeSettings);

  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      theme = btn.dataset.theme;
      applyTheme();
      savePrefs();
    });
  });
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      readMode = btn.dataset.mode;
      applyMode();
      savePrefs();
      if (currentSurah) {
        if (readMode === 'scroll') renderScrollMode();
        else {
          pages = paginate(currentSurah);
          pageIndex = 0;
          renderCurrent(innerFront);
          updatePill();
        }
        updateReaderHeader();
      }
    });
  });

  $('set-font-up').addEventListener('click', () => {
    fontSize = Math.min(40, fontSize + 2);
    applyFont(); savePrefs();
    if (currentSurah && readMode === 'book') {
      const old = (pages[pageIndex] && pages[pageIndex][0]) ? pages[pageIndex][0].n : 1;
      pages = paginate(currentSurah);
      pageIndex = Math.max(0, pages.findIndex(p => p.some(a => a.n === old)));
      renderCurrent(innerFront); updatePill();
    } else if (currentSurah) renderScrollMode();
  });
  $('set-font-down').addEventListener('click', () => {
    fontSize = Math.max(18, fontSize - 2);
    applyFont(); savePrefs();
    if (currentSurah && readMode === 'book') {
      const old = (pages[pageIndex] && pages[pageIndex][0]) ? pages[pageIndex][0].n : 1;
      pages = paginate(currentSurah);
      pageIndex = Math.max(0, pages.findIndex(p => p.some(a => a.n === old)));
      renderCurrent(innerFront); updatePill();
    } else if (currentSurah) renderScrollMode();
  });

  $('toggle-tr').addEventListener('click', () => {
    showTranslation = !showTranslation;
    $('toggle-tr').classList.toggle('on', showTranslation);
    savePrefs();
    if (currentSurah) {
      if (readMode === 'scroll') renderScrollMode();
      else {
        const old = (pages[pageIndex] && pages[pageIndex][0]) ? pages[pageIndex][0].n : 1;
        pages = paginate(currentSurah);
        pageIndex = Math.max(0, pages.findIndex(p => p.some(a => a.n === old)));
        renderCurrent(innerFront); updatePill();
      }
    }
  });

  /* Font buttons in book mode */
  $('btn-font-up')?.addEventListener('click', () => {
    fontSize = Math.min(40, fontSize + 2);
    applyFont(); savePrefs();
    if (currentSurah) {
      const old = (pages[pageIndex] && pages[pageIndex][0]) ? pages[pageIndex][0].n : 1;
      pages = paginate(currentSurah);
      pageIndex = Math.max(0, pages.findIndex(p => p.some(a => a.n === old)));
      renderCurrent(innerFront); updatePill();
    }
  });
  $('btn-font-down')?.addEventListener('click', () => {
    fontSize = Math.max(18, fontSize - 2);
    applyFont(); savePrefs();
    if (currentSurah) {
      const old = (pages[pageIndex] && pages[pageIndex][0]) ? pages[pageIndex][0].n : 1;
      pages = paginate(currentSurah);
      pageIndex = Math.max(0, pages.findIndex(p => p.some(a => a.n === old)));
      renderCurrent(innerFront); updatePill();
    }
  });

  /* Continue button */
  function updateContinueButton() {
    const btn = $('btn-continue');
    const last = loadLastRead();
    if (last && last.surah >= 1 && last.surah <= 114) {
      const s = META.find(x => x.n === last.surah);
      btn.style.display = 'inline-flex';
      btn.textContent = s ? `▶ ادامه: ${s.ar}` : '▶ ادامه مطالعه';
      btn.onclick = () => openSurah(last.surah, last.page || 0);
    } else btn.style.display = 'none';
  }

  /* Resize */
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (!$('view-reader').classList.contains('active') || !currentSurah || readMode !== 'book') return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const oldAyah = (pages[pageIndex] && pages[pageIndex][0]) ? pages[pageIndex][0].n : 1;
      pages = paginate(currentSurah);
      pageIndex = Math.max(0, pages.findIndex(p => p.some(a => a.n === oldAyah)));
      if (pageIndex < 0) pageIndex = 0;
      renderCurrent(innerFront); updatePill(); saveLastRead();
    }, 250);
  });

  /* Init */
  renderSurahList();
  updateContinueButton();

  /* ── PWA Install & Service Worker ── */
  let deferredPrompt = null;
  const btnInstall = $('btn-install');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
  });

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    if (btnInstall) btnInstall.style.display = 'none';
    showToast('اپلیکیشن با موفقیت نصب شد ✓');
  });

  // Hide install button if already running as installed PWA
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
    if (btnInstall) btnInstall.style.display = 'none';
  }

  if (btnInstall) {
    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          showToast('در حال نصب اپلیکیشن...');
        }
        deferredPrompt = null;
        btnInstall.style.display = 'none';
        return;
      }
      // Fallback guidance for iOS / browsers without prompt
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        showToast('در Safari روی دکمه Share (□↑) بزنید ← سپس «Add to Home Screen» یا «افزودن به صفحه اصلی» را انتخاب کنید', 5500);
      } else {
        showToast('از منوی مرورگر (⋮ یا ⋯) گزینه «نصب اپ» یا «Install app» را انتخاب کنید', 4500);
      }
    });
  }

  // Register Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('SW registered', reg.scope))
        .catch((err) => console.warn('SW registration failed', err));
    });
  }

  /* Pull-to-refresh (list view only) */
  (function initPullToRefresh() {
    const list = $('view-list')?.querySelector('.list');
    if (!list) return;

    const pull = document.createElement('div');
    pull.className = 'pull-indicator';
    pull.innerHTML = '<span class="pull-ico">⟳</span>';
    list.parentNode.insertBefore(pull, list);

    const THRESHOLD = 70;
    let startY = 0, pulling = false, dragging = false, refreshing = false;

    list.addEventListener('touchstart', (e) => {
      if (refreshing || list.scrollTop > 0) { pulling = false; return; }
      startY = e.touches[0].clientY;
      pulling = true;
      dragging = false;
    }, { passive: true });

    list.addEventListener('touchmove', (e) => {
      if (!pulling || refreshing) return;
      const dy = e.touches[0].clientY - startY;
      if (dy > 0 && list.scrollTop === 0) {
        dragging = true;
        const dist = Math.min(dy * 0.5, 100);
        pull.style.height = dist + 'px';
        pull.style.opacity = Math.min(dist / THRESHOLD, 1);
        pull.classList.toggle('ready', dist >= THRESHOLD);
      }
    }, { passive: true });

    list.addEventListener('touchend', () => {
      if (!pulling) return;
      pulling = false;
      const dist = parseFloat(pull.style.height) || 0;
      if (dragging && dist >= THRESHOLD) {
        refreshing = true;
        pull.style.height = '46px';
        pull.style.opacity = '1';
        pull.classList.add('spinning');
        setTimeout(() => location.reload(), 350);
      } else {
        pull.style.height = '0px';
        pull.style.opacity = '0';
        pull.classList.remove('ready');
      }
      dragging = false;
    });
  })();
})();
</script>
</body>
